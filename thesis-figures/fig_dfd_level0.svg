<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <style>
    text { font-family: 'Helvetica', 'Arial', sans-serif; fill: #101828; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 14px; }
    .small { font-size: 12px; fill: #475467; }
    .mono { font-family: 'Menlo', 'Consolas', monospace; font-size: 12px; }
    .arrow { stroke: #475467; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrow-thick { stroke: #5b4bff; stroke-width: 2; fill: none; marker-end: url(#arrowP); }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .box-primary { fill: #eceaff; stroke: #5b4bff; stroke-width: 1.5; }
    .box-accent { fill: #dcf6f0; stroke: #06b6a3; stroke-width: 1.5; }
    .actor-circle { fill: #ffffff; stroke: #101828; stroke-width: 2; }
    .usecase { fill: #ffffff; stroke: #5b4bff; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b4bff"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" class="title">DFD Level-0 (Context Diagram)</text>
<circle cx="450" cy="220" r="80" fill="#eceaff" stroke="#5b4bff" stroke-width="2"/>
<text x="450" y="215" text-anchor="middle" class="label" font-weight="700">0.0</text>
<text x="450" y="235" text-anchor="middle" class="label">FitFlow Platform</text>
<g>
    <rect x="40" y="180" width="140" height="80" rx="8" class="box"/>
    <text x="110" y="225" text-anchor="middle" class="label">Trainee</text>
  </g>
<g>
    <rect x="720" y="180" width="140" height="80" rx="8" class="box"/>
    <text x="790" y="225" text-anchor="middle" class="label">Coach</text>
  </g>
<g>
    <rect x="380" y="80" width="140" height="50" rx="8" class="box"/>
    <text x="450" y="110" text-anchor="middle" class="label">Admin</text>
  </g>
<g>
    <rect x="380" y="320" width="140" height="50" rx="8" class="box"/>
    <text x="450" y="350" text-anchor="middle" class="label">Stripe</text>
  </g>
<line x1="180" y1="200" x2="370" y2="200" class="arrow"/><rect x="221" y="189" width="108" height="18" fill="#ffffff" />
          <text x="275" y="203" text-anchor="middle" class="small">session, msg</text>
<line x1="370" y1="240" x2="180" y2="240" class="arrow"/><rect x="201" y="229" width="148" height="18" fill="#ffffff" />
          <text x="275" y="243" text-anchor="middle" class="small">progress, replies</text>
