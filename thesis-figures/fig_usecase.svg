<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <style>
    text { font-family: 'Helvetica', 'Arial', sans-serif; fill: #101828; }
