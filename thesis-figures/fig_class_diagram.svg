<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
  <style>
    text { font-family: 'Helvetica', 'Arial', sans-serif; fill: #101828; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 14px; }
    .small { font-size: 12px; fill: #475467; }
    .mono { font-family: 'Menlo', 'Consolas', monospace; font-size: 12px; }
    .arrow { stroke: #475467; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrow-thick { stroke: #5b4bff; stroke-width: 2; fill: none; marker-end: url(#arrowP); }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .box-primary { fill: #eceaff; stroke: #5b4bff; stroke-width: 1.5; }
    .box-accent { fill: #dcf6f0; stroke: #06b6a3; stroke-width: 1.5; }
    .actor-circle { fill: #ffffff; stroke: #101828; stroke-width: 2; }
    .usecase { fill: #ffffff; stroke: #5b4bff; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b4bff"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" class="title">Class Diagram (Key Models &amp; Services)</text>
<g>
    <rect x="40" y="70" width="240" height="202" fill="#ffffff" stroke="#101828" stroke-width="1.5"/>
    <rect x="40" y="70" width="240" height="30" fill="#eceaff"/>
    <text x="160" y="90" text-anchor="middle" class="label" font-weight="700">User</text>
    <line x1="40" y1="100" x2="280" y2="100" stroke="#101828"/>
    <text x="50" y="118" class="mono">+ email: string</text><text x="50" y="134" class="mono">+ role: UserRole</text><text x="50" y="150" class="mono">+ password: hashed</text><text x="50" y="166" class="mono">+ subscription: Sub</text><text x="50" y="182" class="mono">+ coachProfile: Profile?</text><text x="50" y="198" class="mono">+ emailVerified: bool</text>
    <line x1="40" y1="210" x2="280" y2="210" stroke="#101828"/>
    <text x="50" y="228" class="mono">+ findById()</text><text x="50" y="244" class="mono">+ updateRole()</text><text x="50" y="260" class="mono">+ suspend()</text>
  </g>
<g>
    <rect x="310" y="70" width="240" height="170" fill="#ffffff" stroke="#101828" stroke-width="1.5"/>
    <rect x="310" y="70" width="240" height="30" fill="#eceaff"/>
    <text x="430" y="90" text-anchor="middle" class="label" font-weight="700">WorkoutSession</text>
    <line x1="310" y1="100" x2="550" y2="100" stroke="#101828"/>
    <text x="320" y="118" class="mono">+ userId: ObjectId</text><text x="320" y="134" class="mono">+ exerciseType: enum</text><text x="320" y="150" class="mono">+ repCount: number</text><text x="320" y="166" class="mono">+ formScore: number</text><text x="320" y="182" class="mono">+ duration: number</text>
    <line x1="310" y1="194" x2="550" y2="194" stroke="#101828"/>
    <text x="320" y="212" class="mono">+ aggregate30d()</text><text x="320" y="228" class="mono">+ create()</text>
  </g>
<g>
    <rect x="580" y="70" width="240" height="170" fill="#ffffff" stroke="#101828" stroke-width="1.5"/>
    <rect x="580" y="70" width="240" height="30" fill="#eceaff"/>
    <text x="700" y="90" text-anchor="middle" class="label" font-weight="700">CoachClient</text>
    <line x1="580" y1="100" x2="820" y2="100" stroke="#101828"/>
    <text x="590" y="118" class="mono">+ coachId: ObjectId</text><text x="590" y="134" class="mono">+ clientId: ObjectId</text><text x="590" y="150" class="mono">+ status: enum</text><text x="590" y="166" class="mono">+ requestedBy: enum</text>
    <line x1="580" y1="178" x2="820" y2="178" stroke="#101828"/>
    <text x="590" y="196" class="mono">+ accept()</text><text x="590" y="212" class="mono">+ decline()</text><text x="590" y="228" class="mono">+ end()</text>
  </g>
<g>
    <rect x="850" y="70" width="240" height="154" fill="#ffffff" stroke="#101828" stroke-width="1.5"/>
    <rect x="850" y="70" width="240" height="30" fill="#eceaff"/>
    <text x="970" y="90" text-anchor="middle" class="label" font-weight="700">Message</text>
    <line x1="850" y1="100" x2="1090" y2="100" stroke="#101828"/>
    <text x="860" y="118" class="mono">+ coachId, clientId</text><text x="860" y="134" class="mono">+ fromId, toId</text><text x="860" y="150" class="mono">+ body: string</text><text x="860" y="166" class="mono">+ readAt: Date?</text>
    <line x1="850" y1="178" x2="1090" y2="178" stroke="#101828"/>
    <text x="860" y="196" class="mono">+ thread()</text><text x="860" y="212" class="mono">+ markRead()</text>
  </g>
<g>
    <rect x="40" y="380" width="240" height="154" fill="#ffffff" stroke="#101828" stroke-width="1.5"/>
    <rect x="40" y="380" width="240" height="30" fill="#eceaff"/>
    <text x="160" y="400" text-anchor="middle" class="label" font-weight="700">PoseDetector</text>
    <line x1="40" y1="410" x2="280" y2="410" stroke="#101828"/>
    <text x="50" y="428" class="mono">- pose: MediaPipe</text><text x="50" y="444" class="mono">- camera: Camera</text><text x="50" y="460" class="mono">- onResultsCb</text>
    <line x1="40" y1="472" x2="280" y2="472" stroke="#101828"/>
    <text x="50" y="490" class="mono">+ initialize(video)</text><text x="50" y="506" class="mono">+ onResults(cb)</text><text x="50" y="522" class="mono">+ stop()</text>
  </g>
<g>
    <rect x="310" y="380" width="240" height="154" fill="#ffffff" stroke="#101828" stroke-width="1.5"/>
    <rect x="310" y="380" width="240" height="30" fill="#eceaff"/>
    <text x="430" y="400" text-anchor="middle" class="label" font-weight="700">SquatDetector</text>
    <line x1="310" y1="410" x2="550" y2="410" stroke="#101828"/>
    <text x="320" y="428" class="mono">- state: enum</text><text x="320" y="444" class="mono">- repCount: number</text><text x="320" y="460" class="mono">- formScore: number</text>
    <line x1="310" y1="472" x2="550" y2="472" stroke="#101828"/>
    <text x="320" y="490" class="mono">+ process(results)</text><text x="320" y="506" class="mono">+ getMetrics()</text><text x="320" y="522" class="mono">+ reset()</text>
  </g>
<g>
    <rect x="580" y="380" width="240" height="138" fill="#ffffff" stroke="#101828" stroke-width="1.5"/>
    <rect x="580" y="380" width="240" height="30" fill="#eceaff"/>
    <text x="700" y="400" text-anchor="middle" class="label" font-weight="700">EntitlementHelper</text>
    <line x1="580" y1="410" x2="820" y2="410" stroke="#101828"/>
    <text x="590" y="428" class="mono">+ tier: free|pro</text><text x="590" y="444" class="mono">+ status: enum</text>
    <line x1="580" y1="456" x2="820" y2="456" stroke="#101828"/>
    <text x="590" y="474" class="mono">+ effectiveTier()</text><text x="590" y="490" class="mono">+ can(feature)</text><text x="590" y="506" class="mono">+ getUserSubscription()</text>
  </g>
<g>
    <rect x="850" y="380" width="240" height="138" fill="#ffffff" stroke="#101828" stroke-width="1.5"/>
    <rect x="850" y="380" width="240" height="30" fill="#eceaff"/>
    <text x="970" y="400" text-anchor="middle" class="label" font-weight="700">AuthService</text>
    <line x1="850" y1="410" x2="1090" y2="410" stroke="#101828"/>
    <text x="860" y="428" class="mono">+ JWT_SECRET</text><text x="860" y="444" class="mono">+ TokenPayload</text>
    <line x1="850" y1="456" x2="1090" y2="456" stroke="#101828"/>
    <text x="860" y="474" class="mono">+ generateToken()</text><text x="860" y="490" class="mono">+ verifyToken()</text><text x="860" y="506" class="mono">+ withRole()</text>
  </g>
<line x1="280" y1="130" x2="310" y2="130" class="arrow"/><rect x="273" y="119" width="44" height="18" fill="#ffffff" />
          <text x="295" y="133" text-anchor="middle" class="small">1..n</text>
<line x1="550" y1="130" x2="580" y2="130" class="arrow"/><rect x="539" y="119" width="52" height="18" fill="#ffffff" />
          <text x="565" y="133" text-anchor="middle" class="small">links</text>
<line x1="820" y1="130" x2="850" y2="130" class="arrow"/><rect x="809" y="119" width="52" height="18" fill="#ffffff" />
          <text x="835" y="133" text-anchor="middle" class="small">sends</text>
<line x1="280" y1="410" x2="310" y2="410" class="arrow"/><rect x="269" y="399" width="52" height="18" fill="#ffffff" />
          <text x="295" y="413" text-anchor="middle" class="small">feeds</text>
</svg>