<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680">
  <style>
    text { font-family: 'Helvetica', 'Arial', sans-serif; fill: #101828; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 14px; }
    .small { font-size: 12px; fill: #475467; }
    .mono { font-family: 'Menlo', 'Consolas', monospace; font-size: 12px; }
    .arrow { stroke: #475467; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrow-thick { stroke: #5b4bff; stroke-width: 2; fill: none; marker-end: url(#arrowP); }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .box-primary { fill: #eceaff; stroke: #5b4bff; stroke-width: 1.5; }
    .box-accent { fill: #dcf6f0; stroke: #06b6a3; stroke-width: 1.5; }
    .actor-circle { fill: #ffffff; stroke: #101828; stroke-width: 2; }
    .usecase { fill: #ffffff; stroke: #5b4bff; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b4bff"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" class="title">Sequence: Login + Role-Based Redirect</text>
<g>
    <rect x="60" y="60" width="120" height="36" class="box-primary"/>
    <text x="120" y="83" text-anchor="middle" class="label" font-weight="700">User</text>
    <line x1="120" y1="96" x2="120" y2="640" stroke="#475467" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
<g>
    <rect x="260" y="60" width="120" height="36" class="box-primary"/>
    <text x="320" y="83" text-anchor="middle" class="label" font-weight="700">Login Page</text>
    <line x1="320" y1="96" x2="320" y2="640" stroke="#475467" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
<g>
    <rect x="460" y="60" width="120" height="36" class="box-primary"/>
    <text x="520" y="83" text-anchor="middle" class="label" font-weight="700">/api/auth/login</text>
    <line x1="520" y1="96" x2="520" y2="640" stroke="#475467" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
<g>
    <rect x="660" y="60" width="120" height="36" class="box-primary"/>
    <text x="720" y="83" text-anchor="middle" class="label" font-weight="700">MongoDB</text>
    <line x1="720" y1="96" x2="720" y2="640" stroke="#475467" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
<g>
    <rect x="840" y="60" width="120" height="36" class="box-primary"/>
    <text x="900" y="83" text-anchor="middle" class="label" font-weight="700">Role Home</text>
    <line x1="900" y1="96" x2="900" y2="640" stroke="#475467" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
<g>
    <line x1="120" y1="130" x2="320" y2="130" class="arrow"/>
    <text x="220" y="124" text-anchor="middle" class="small">enter creds + submit</text>
  </g>
<g>
    <line x1="320" y1="170" x2="520" y2="170" class="arrow"/>
    <text x="420" y="164" text-anchor="middle" class="small">POST {email, password}</text>
  </g>
<rect x="515" y="170" width="10" height="180" fill="#eceaff" stroke="#5b4bff"/>
<g>
    <line x1="520" y1="200" x2="720" y2="200" class="arrow"/>
    <text x="620" y="194" text-anchor="middle" class="small">findOne(email)</text>
  </g>
<g>
    <line x1="720" y1="230" x2="520" y2="230" class="arrow"/>
    <text x="620" y="224" text-anchor="middle" class="small">user doc</text>
  </g>
<g>
    <line x1="520" y1="270" x2="520" y2="270" class="arrow"/>
    <text x="520" y="264" text-anchor="middle" class="small">comparePassword (bcrypt)</text>
  </g>
<g>
    <line x1="520" y1="310" x2="520" y2="310" class="arrow"/>
    <text x="520" y="304" text-anchor="middle" class="small">check suspendedAt</text>
  </g>
<g>
    <line x1="520" y1="350" x2="320" y2="350" class="arrow"/>
    <text x="420" y="344" text-anchor="middle" class="small">Set-Cookie: token (JWT)</text>
  </g>
<g>
    <line x1="320" y1="400" x2="120" y2="400" class="arrow"/>
    <text x="220" y="394" text-anchor="middle" class="small">data.user (with role)</text>
  </g>
<rect x="315" y="400" width="10" height="80" fill="#eceaff" stroke="#5b4bff"/>
<g>
    <line x1="320" y1="440" x2="320" y2="440" class="arrow"/>
    <text x="320" y="434" text-anchor="middle" class="small">router.push(homeFor(role))</text>
  </g>
<g>
    <line x1="320" y1="500" x2="900" y2="500" class="arrow"/>
    <text x="610" y="494" text-anchor="middle" class="small">navigate /dashboard | /coach | /admin</text>
  </g>
<rect x="895" y="500" width="10" height="80" fill="#eceaff" stroke="#5b4bff"/>
<text x="20" y="660" class="small">homeFor() in src/lib/roleHome.ts is the single source of truth for role landing pages.</text>
</svg>